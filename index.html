<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form">
        <h1>Agrega una planta</h1>
        <input type="text" name="ID" id="ID" placeholder="Ingresa un ID">
        <input type="text" name="nombre" id="nombre" placeholder="Nombre de la planta">
        <input type="number" name="precio" id="precio" placeholder="Ingresa el precio">
        <input type="text" name="dimension" id="dimension" placeholder="Ingresa su dimension">
        <input type="number" name="stock" id="stock" placeholder="Ingresa tu stock">
        <button id="agregar">Agregar</button>
    </div>
</body>
<script src="db.js" type="module"></script>
</html>
